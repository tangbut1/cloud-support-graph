# cloud-support-graph / Nginx 反代配置（HTTP 80 演示版）
# 职责：/ → 前端静态资源（SPA），/api/ → FastAPI，SSE 关闭缓冲。
# 安全说明：纯 IP 课程演示暂无备案域名与 CA 证书时使用 80 端口；
#           若绑定已备案域名上线生产，请改用 deploy/nginx-tls.conf.example 启用 HTTPS 443。

server {
    listen      80;
    server_name _;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 截图上传限制 2MB，留 1MB 余量给 multipart 头
    client_max_body_size 3m;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/csg.access.log;
    error_log  /var/log/nginx/csg.error.log warn;

    # ---- 后端 API ----
    # 用 ^~ 前缀阻止下面的静态资源正则拦截 /api/.../attachments/*.png
    location ^~ /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # SSE 流式输出的关键：必须关掉缓冲，并拉长读超时
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }


    # ---- 接口文档（Swagger UI / ReDoc / OpenAPI 契约）----
    # 使用 ^~ 前缀，避免被下方静态资源正则拦截
    location ^~ /docs {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ^~ /redoc {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- 前端 SPA ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 静态资源缓存（Nginx 在 location 内声明 add_header 会覆盖 server 级头，须显式继承安全头）----
    location ~* \.(?:js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
